<!-- ========================================================
     감자(Gamza) 마켓 - 화면 2: 상세 팝업(모달) 템플릿
     ======================================================== -->

<div id="gamzaDetailModal" class="gamza-modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="gamzaModalTitle">
  <div class="gamza-modal-container">
    <!-- 우측 상단 닫기 [✕] 버튼 -->
    <button type="button" class="gamza-modal-close-btn" id="gamzaModalCloseBtn" aria-label="상세보기 닫기" title="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M18 6L6 18M6 6l12 12"></path>
      </svg>
    </button>

    <!-- 스크롤 가능 영역 -->
    <div class="gamza-modal-scrollable">
      <!-- 2. 상단 대표 이미지 (16:9 ~ 4:3 비율) -->
      <div class="gamza-modal-image-wrapper">
        <img id="gamzaModalImage" class="gamza-modal-image" src="" alt="상품 이미지" style="display: none;" />
        <div id="gamzaModalImagePlaceholder" class="gamza-modal-image-placeholder">
          <span class="gamza-potato-icon">🥔</span>
          <span>등록된 이미지가 없습니다</span>
        </div>
      </div>

      <!-- 3. 본문 정보 영역 (순서 준수) -->
      <div class="gamza-modal-body">
        <!-- 3-1. 판매 상태 뱃지 & 3-2. 카테고리 -->
        <div class="gamza-meta-header">
          <span id="gamzaModalStatusBadge" class="gamza-status-badge status-selling">판매중</span>
          <span id="gamzaModalCategory" class="gamza-category">카테고리</span>
        </div>

        <!-- [신규] 작성자 전용 판매 상태 선택 영역 -->
        <div id="gamzaModalOwnerStatusBar" class="gamza-owner-status-bar" style="display: none;">
          <div class="gamza-owner-status-label">
            <span class="gamza-owner-tag">🥔 내 글 관리</span>
            <span>거래 상태 변경:</span>
          </div>
          <div class="gamza-owner-status-chips">
            <button type="button" class="gamza-owner-status-btn status-selling" data-status="selling">판매중</button>
            <button type="button" class="gamza-owner-status-btn status-reserved" data-status="reserved">예약중</button>
            <button type="button" class="gamza-owner-status-btn status-completed" data-status="completed">거래 완료</button>
          </div>
        </div>

        <!-- 3-3. 상품명 (제목, 크고 명확하게) -->
        <h2 id="gamzaModalTitle" class="gamza-product-title">상품 제목</h2>

        <!-- 3-4. 판매 위치 및 업로드 시간 -->
        <div class="gamza-sub-info">
          <span class="gamza-sub-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
              <circle cx="12" cy="9" r="2.5"/>
            </svg>
            <span id="gamzaModalLocation">지역 정보</span>
          </span>
          <span class="gamza-sub-info-dot"></span>
          <span class="gamza-sub-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span id="gamzaModalCreatedAt">시간 정보</span>
          </span>
        </div>

        <!-- 3-5. 가격 (굵은 폰트) -->
        <div id="gamzaModalPrice" class="gamza-product-price">0원</div>

        <div class="gamza-divider"></div>

        <!-- 3-6. 상품 상세 설명 (줄바꿈 지원) -->
        <div id="gamzaModalDescription" class="gamza-product-description">상세 설명이 들어갑니다.</div>
      </div>

      <!-- 4. 판매자 정보 영역 -->
      <div class="gamza-seller-section">
        <div class="gamza-seller-left">
          <img id="gamzaModalSellerAvatar" class="gamza-seller-avatar" src="" alt="판매자 프로필" />
          <div class="gamza-seller-details">
            <div class="gamza-seller-name-row">
              <span id="gamzaModalSellerNickname" class="gamza-seller-nickname">판매자명</span>
              <span class="gamza-certified-badge">
                <span>✓</span> 동네인증
              </span>
            </div>
            <span id="gamzaModalSellerLocation" class="gamza-seller-location">서초구 방배동</span>
          </div>
        </div>

        <!-- 감자 매너 / 포슬온도 디테일 -->
        <div class="gamza-manner-box">
          <div class="gamza-temp-header">
            <span id="gamzaModalSellerTemp" class="gamza-temp-value">36.5℃</span>
            <span class="gamza-temp-emoji">🥔</span>
          </div>
          <div class="gamza-temp-bar-wrapper">
            <div id="gamzaModalSellerTempBar" class="gamza-temp-bar-fill" style="width: 50%;"></div>
          </div>
          <span class="gamza-temp-label">포슬온도</span>
        </div>
      </div>
    </div>

    <!-- 5. 하단 고정/액션 바 -->
    <div class="gamza-modal-action-bar">
      <!-- 관심 추가 버튼 (하트 아이콘, 활성화 토글 연출) -->
      <button type="button" class="gamza-like-btn" id="gamzaModalLikeBtn" aria-label="관심 상품 추가" title="관심 추가">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </button>

      <!-- 채팅 시작하기 버튼 (감자 브라운 포인트) -->
      <button type="button" class="gamza-chat-btn" id="gamzaModalChatBtn">
        <svg viewBox="0 0 24 24">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/>
        </svg>
        <span>감자톡 채팅하기</span>
      </button>

      <!-- [신규] 작성자 전용 수정 / 삭제 버튼 그룹 -->
      <div class="gamza-modal-owner-actions" id="gamzaModalOwnerActions" style="display: none;">
        <button type="button" class="gamza-owner-btn gamza-owner-edit-btn" id="gamzaModalEditBtn" title="게시글 수정">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span>게시글 수정</span>
        </button>
        <button type="button" class="gamza-owner-btn gamza-owner-delete-btn" id="gamzaModalDeleteBtn" title="게시글 삭제">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
          <span>삭제</span>
        </button>
      </div>
    </div>
  </div>
</div>
